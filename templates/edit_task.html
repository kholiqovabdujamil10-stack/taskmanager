{% extends 'basic.html' %}
{% block title %}Edit Task{% endblock %}
{% block content %}

<div class="form-container">
    <h1>Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="title" value="{{ task.title }}" placeholder="Task Title" required>

        <textarea name="description" placeholder="Task Description" rows="5">{{ task.description }}</textarea>

        <label>Due Date</label>
        <input type="datetime-local" name="due_date" value="{{ task.due_date|date:'Y-m-d\TH:i' }}">

        <button type="submit" class="btn">Save Changes</button>
    </form>

    <p><a href="{% url 'tasks' %}">Back to Tasks</a></p>
</div>
{% endblock %}
