{% extends 'basic.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}

<div class="profile-container">
    <div class="profile-avatar">{{ request.user.username|first|upper }}</div>
    <h1>Welcome, <span>{{ request.user.username }}</span>!</h1>
    <p>✦ Your personal space in TaskManager</p>
    <p class="profile-email">{{ request.user.email }}</p>

    <div class="profile-buttons">
        <a href="{% url 'tasks' %}" class="btn">✦ My Tasks</a>
        <a href="{% url 'chat' %}" class="btn">💬 Global Chat</a>
        <a href="{% url 'logout' %}" class="btn logout-btn">↗ Logout</a>
    </div>
</div>

{% endblock %}
